name: Health Check

on:
  workflow_call:

jobs:
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Wait for Render deployment
        run: sleep 60

      - name: Check backend health
        run: |
          if [ -z "${{ secrets.BACKEND_URL }}" ]; then
            echo "BACKEND_URL is not configured."
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if curl --fail --silent "${{ secrets.BACKEND_URL }}/api/v1/health"; then
              echo "Backend is healthy"
              exit 0
            fi

            echo "Attempt ${attempt}/30: backend is not ready"
            sleep 10
          done

          echo "Backend did not become healthy in time"
          exit 1

      - name: Check frontend health
        run: |
          if [ -z "${{ secrets.FRONTEND_URL }}" ]; then
            echo "FRONTEND_URL is not configured."
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if curl --fail --silent "${{ secrets.FRONTEND_URL }}"; then
              echo "Frontend is available"
              exit 0
            fi

            echo "Attempt ${attempt}/30: frontend is not ready"
            sleep 10
          done

          echo "Frontend did not become available in time"
          exit 1
