name: Deploy

on:
  workflow_call:

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy backend
        run: |
          if [ -z "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_BACKEND_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi

          curl --fail --silent --show-error -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}"

      - name: Deploy frontend
        run: |
          if [ -z "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_FRONTEND_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi

          curl --fail --silent --show-error -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}"
